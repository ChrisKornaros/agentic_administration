# Board config — Plane Cloud (design: roadmap/14 §6). One file per board.
# Copy to boards/<board>.toml (gitignored), run
#   uv run python -m adapters.plane describe boards/<board>.toml
# and fix what it reports. Keep the token OUT of this file: `token_env`
# names the env var the adapter reads (or `<token_env>_BW_ITEM` names the
# Bitwarden item holding it — see server/secrets.py).

backend = "plane"
board_type = "software"  # "software" (default) | "calendar" (calendar.example.toml) — D38
confirm = "always"       # "always" (default) | "never" — D5

[connection]
token_env = "PLANE_API_KEY"          # the env var name — never the value
# base_url = "https://api.plane.so/api/v1"   # adapter default; set for self-hosted
workspace = "my-workspace"           # the workspace slug in the URL
project = "00000000-0000-0000-0000-000000000000"   # project id, identifier (e.g. "AA") or name

# Canonical level -> how this board realizes it. Exactly one of:
#   type      = "<work-item type id or name>"   a native type
#   container = "<container kind>"              membership (Plane module = Feature, D3)
#   parent    = "<label>"                       parent link + a type label (generic fallback, D4)
#   label     = "<label>"                       a label alone marks the level
#   collapse  = "label" | "component" | "description_line"   [+ template]
# Epic, Story, Bug and Task must be materialized; Initiative and Feature may collapse.
# A `type` may be the work-item type's id or its name (resolved on describe).
# Phase 1 finding: no Plane board ships a Bug type — provision it first.
# A collapse template may use {name} (the ref's key, else id), {id}, {key}, {level};
# a label it produces must already exist on the board.
[levels]
initiative = { collapse = "description_line", template = "**Initiative:** {name}" }
epic       = { type = "Epic" }
feature    = { container = "module" }
story      = { type = "Story" }
bug        = { type = "Bug" }
task       = { type = "Task" }

# Canonical state -> the board's state name (Plane default workflow shown).
[states]
backlog     = "Backlog"
todo        = "Todo"
in_progress = "In Progress"
done        = "Done"
cancelled   = "Cancelled"

[labels]
review   = "needs-review"                     # D5: cleared by the product owner
taxonomy = ["bug", "feature", "chore", "docs"] # the code-board label axis (CONVENTIONS §4)

[naming]
iteration = "YYYYMM"     # cycle names, e.g. 202609
item_case = "title"      # "title" | "sentence" | "any"

# Custom fields, optional (D41): a name you choose -> a work-item property
# on one of the mapped types, by its name or id (calendar.example.toml).
# [fields]
# estimate = "Estimate"
