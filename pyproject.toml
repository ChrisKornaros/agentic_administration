[project]
name = "agentic-administration"
version = "0.0.1"
description = "Agent-operated backlog administration over a canonical work-item model, tracker-agnostic via adapters."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Runtime stays standard-library only (see the seed CLI's zero-dependency
# posture); anything added here needs a reason in the PR.
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
